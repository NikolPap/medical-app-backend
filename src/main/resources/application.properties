spring.application.name=medical-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema gehört Flyway, Hibernate prüft nur
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

jwt.secret=${JWT_SECRET}
jwt.expiration-hours=24

admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.mail.log-codes=false

spring.profiles.default=dev