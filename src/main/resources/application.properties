spring.application.name=medical-app

# Datenbank (Zugangsdaten kommen aus Umgebungsvariablen)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mail (lokal z.B. MailHog auf Port 1025, ohne Login)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=24