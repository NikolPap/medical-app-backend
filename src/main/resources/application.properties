spring.application.name=medical-app
# ===============================
# DATENBANKVERBINDUNG (POSTGRESQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/medical_db
spring.datasource.username=postgres
spring.datasource.password=26334

# ===============================
# HIBERNATE-EINSTELLUNGEN (Erstellt automatisch die Tabellen)
# ===============================
# 'update' erstellt oder aktualisiert die Tabellen automatisch basierend auf unserem Java-Code
spring.jpa.hibernate.ddl-auto=update

# Zeigt den von Spring im Hintergrund generierten SQL-Code in der Konsole an (Perfekt zum Lernen!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Fake-Daten, damit Spring Boot den JavaMailSender erstellt!
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=fake
spring.mail.password=fake